name: CLASP

on:
  push:
    branches: [ "develop" ]

jobs:
  setup-and-test-CLASP:
    runs-on: ubuntu-24.04
    # ubuntu-latest is mutable. Additionally, 24.04 LTS has the most security features.
    # Though, latest currently points to this version, but it's still better not to use the latest tag.

    # using the :latest mutable tag with no digest pinning is insecure. (CWE-829, CWE-494)
    # :latest is mutable. Additionally, latest can change at any time.
    # We need to pin the digest. 
    # Actually ghcr.io/clasp-developers/clasp is stale. Three years old, no version control, latest tag, and old keyrings, so for no we will use something else.
    # We're actually not even going to use docker. IF we want reproducibility, then NIX is better.
    # However, hermeticity (especially at the extent of nix), also means that our tests run in a pristine environment that real users may never have.
    # So we will need to have both: hermetic tests, and integration tests.

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # 4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3  # v31.10.6
        with:
          # Passes GITHUB_TOKEN to avoid Nix hitting anonymous GitHub API rate limits
          # when fetching flake inputs during the workflow.
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
 
      - name: qlot init
        run: nix develop --no-update-lock-file --command qlot init
        # --no-update-lock-file ensures flake.lock is used exactly as committed.
        # Removing this flag would allow Nix to silently update inputs, breaking
        # reproducibility.

      - name: Install qlot
        # Qlot has no pre-built Linux binaries. We fetch the tar.gz at a
        # pinned version, verify its SHA-256, then build it using SBCL and
        # OpenSSL provided by the Nix devShell.
        #
        # This replaces `curl -L https://qlot.tech/installer | sh`,
        # which had no integrity guarantee. (CWE-494)
        #
        # To get QLOT_SHA256 for a new version:
        #   curl -fsSL https://github.com/fukamachi/qlot/releases/download/<ver>/qlot-<ver>.tar.gz \
        #     | sha256sum
        run: |
          QLOT_VERSION="1.8.3"
          QLOT_SHA256="e7be45d5cd9e1a013910cec272fe8a3c1078ee31f0c3cbfce00c3bc8c6c688d6"
 
          curl -fsSL \
            "https://github.com/fukamachi/qlot/releases/download/${QLOT_VERSION}/qlot-${QLOT_VERSION}.tar.gz" \
            -o /tmp/qlot.tar.gz
 
          echo "${QLOT_SHA256}  /tmp/qlot.tar.gz" | sha256sum -c
 
          tar xfz /tmp/qlot.tar.gz -C /tmp
          cd /tmp/qlot-${QLOT_VERSION}
 
          # Build and install using SBCL + OpenSSL from the Nix devShell.
          nix develop ${{ github.workspace }}#default --no-update-lock-file \
            --command bash -c "./scripts/setup.sh && sudo ./scripts/install.sh /usr/local/bin"
 
      - name: qlot init
        run: nix develop --no-update-lock-file --command qlot init

      - name: Install dependencies
        run: nix develop --no-update-lock-file --command make deps
 
      - name: Run tests
        run: nix develop --no-update-lock-file --command make test
 
      - name: Run benchmarks
        run: echo "Benchmarks are not yet compatible with CLASP."
        # run: nix develop --no-update-lock-file --command make benchmark
